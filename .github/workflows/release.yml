  Windows:
    name: Windows
    runs-on: windows-latest
    env:
      # electron-builder accepts a base64 PFX through CSC_LINK. Prefer the
      # namespaced secrets while keeping compatibility with standard names.
      CSC_LINK: ${{ secrets.WIN_CSC_LINK || secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD || secrets.CSC_KEY_PASSWORD }}
    # needs: CheckCode
    steps:
      - name: Check out git repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node Env
        uses: ./.github/actions/setup

      - name: Verify Windows signing secrets
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK)) {
            Write-Error 'A Windows Authenticode PFX secret is required for candidate and official builds.'
            exit 1
          }
          if ([string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD)) {
            Write-Error 'CSC_KEY_PASSWORD is required for candidate and official builds.'
            exit 1
          }

      - name: Build src code
        run: |
          git status --porcelain
          npm run build

      - name: Verify official publication token
        if: ${{ inputs.publish_release }}
        env:
          BT_TOKEN: ${{ secrets.BT_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BT_TOKEN)) {
            Write-Error 'BT_TOKEN is required when publish_release is enabled.'
            exit 1
          }

      - name: Publish official packages
        if: ${{ inputs.publish_release }}
        run: |
          npm run publish:win:7z:x64
          npm run publish:win:7z:arm64
          npm run publish:win:setup:arm64
          npm run publish:win:setup:x64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BT_TOKEN: ${{ secrets.BT_TOKEN }}

      - name: Verify official Authenticode signatures
        if: ${{ inputs.publish_release }}
        shell: pwsh
        run: |
          $executables = @(Get-ChildItem -LiteralPath build -Filter '*.exe' -File)
          if ($executables.Count -eq 0) {
            Write-Error 'No Windows installers were produced for signature verification.'
            exit 1
          }
          foreach ($file in $executables) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne 'Valid') {
              Write-Error "Authenticode verification failed for $($file.Name): $($signature.Status)"
              exit 1
            }
            Write-Host "$($file.Name): $($signature.SignerCertificate.Subject)"
          }

      - name: Build candidate package
        if: ${{ !inputs.publish_release }}
        run: npm run pack:win:setup:x64

      - name: Upload candidate installer
        if: ${{ !inputs.publish_release }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visoncube-music-windows-x64-release-candidate
          path: |
            build/*-x64-Setup.exe
            build/*.blockmap
            build/latest.yml
          if-no-files-found: error

      - name: Verify candidate Authenticode signature
        if: ${{ !inputs.publish_release }}
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath build -Filter '*-x64-Setup.exe' -File | Select-Object -First 1
          if ($null -eq $installer) {
            Write-Error 'Candidate Windows installer was not produced.'
            exit 1
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($signature.Status -ne 'Valid') {
            Write-Error "Authenticode verification failed for $($installer.Name): $($signature.Status)"
            exit 1
          }
          Write-Host "$($installer.Name): $($signature.SignerCertificate.Subject)"

      - name: Generate official file MD5
        if: ${{ inputs.publish_release }}
        run: |
          cd build
          Get-FileHash *.exe,*.7z -Algorithm MD5 | Format-List

      - name: Generate candidate SHA-256
        if: ${{ !inputs.publish_release }}
        run: |
          cd build
          Get-FileHash *.exe -Algorithm SHA256 | Format-List


  Windows_7:
    name: Windows_7
    if: ${{ inputs.publish_release }}
    runs-on: windows-latest
    # needs: CheckCode
    steps:
      - name: Check out git repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node Env
        uses: ./.github/actions/setup

      - name: Prepare win7 undici env
        run: |
          npm install undici@5
          Set-Content -Path .\src\common\utils\request.ts -Value "export * from './request_node16'"

      - name: Build src code
        env:
          BUILD_WIN7: true
        run: |
          git status --porcelain
          npm run build

      - name: Prepare win7 electron env
        run: |
          npm install electron@22
          pip.exe install setuptools

      - name: Release win7 package
        run: |
          npm run publish:win7:setup:x64
          npm run publish:win7:7z:x64
          npm run publish:win7:7z:x86
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BT_TOKEN: ${{ secrets.BT_TOKEN }}

      - name: Generate file MD5
        run: |
          cd build
          Get-FileHash *.exe,*.7z -Algorithm MD5 | Format-List

  Mac:
    name: Mac
    if: ${{ inputs.publish_release }}
    runs-on: macos-latest
    # needs: CheckCode
    steps:
      - name: Check out git repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install python3 setuptools
        run: brew install python-setuptools

      - name: Setup Node Env
        uses: ./.github/actions/setup

      - name: Build src code
        run: |
          git status --porcelain
          npm run build

      - name: Release package
        run: |
          npm run publish:mac:dmg
          npm run publish:mac:dmg:arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BT_TOKEN: ${{ secrets.BT_TOKEN }}

      - name: Generate file MD5
        run: |
          cd build
          md5 *.dmg

  Linux:
    name: Linux
    if: ${{ inputs.publish_release }}
    runs-on: ubuntu-latest
    # needs: CheckCode
    steps:
      - name: Install package
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools

      - name: Check out git repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30af803 # v6

      - name: Setup Node Env
        uses: ./.github/actions/setup

      - name: Build src code
        run: |
          git status --porcelain
          npm run build

      - name: Release package
        run: |
          npm run publish:linux:deb:amd64
          npm run publish:linux:deb:arm64
          npm run publish:linux:deb:armv7l
          npm run publish:linux:appImage
          npm run publish:linux:rpm
          npm run publish:linux:pacman
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BT_TOKEN: ${{ secrets.BT_TOKEN }}

      - name: Generate file MD5
        run: |
          cd build
          md5sum *.deb *.rpm *.pacman *.AppImage
