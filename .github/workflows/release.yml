name: Build

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Create official release assets (requires BT_TOKEN)'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

env:
  IS_CI: 'true'

jobs:
