name: Build

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Create the official GitHub Release after candidate validation'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  IS_CI: 'true'

jobs:
  Windows:
    name: Windows x64 candidate
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out git repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node environment
        uses: ./.github/actions/setup

      - name: Verify release metadata
        run: |
          npm run publish
          git diff --exit-code -- package.json package-lock.json CHANGELOG.md publish/version.json

      - name: Test music sync model
        run: npm run test:music-sync

      - name: Lint source code
        run: npm run lint

      - name: Build all source bundles
        run: npm run build

      - name: Build x64 installer
        run: npm run pack:win:setup:x64

      - name: Verify candidate assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = node -p "require('./package.json').version"
          $installerName = "VisonCube-Music-v$version-x64-Setup.exe"
          $installer = Get-Item -LiteralPath (Join-Path 'build' $installerName)
          $blockmap = Get-Item -LiteralPath "$($installer.FullName).blockmap"
          $latest = Get-Item -LiteralPath 'build/latest.yml'
          $latestContent = Get-Content -Raw -LiteralPath $latest.FullName
          if ($latestContent -notmatch "(?m)^version:\s+$([regex]::Escape($version))\s*$") {
            throw "latest.yml version does not match package.json: $version"
          }
          if ($latestContent -notmatch [regex]::Escape("path: $installerName")) {
            throw "latest.yml does not reference $installerName"
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($signature.Status -ne 'NotSigned') {
            throw "Expected the approved unsigned Windows package, got: $($signature.Status)"
          }
          $assets = @($installer, $blockmap, $latest)
          $checksumLines = foreach ($asset in $assets) {
            $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $asset.FullName
            "$($hash.Hash.ToLowerInvariant()) *$($asset.Name)"
          }
          Set-Content -LiteralPath 'build/SHA256SUMS.txt' -Value $checksumLines -Encoding utf8NoBOM
          $assets | Select-Object Name, Length
          $checksumLines
          Write-Output 'Authenticode status: NotSigned'

      - name: Upload candidate assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visoncube-music-windows-x64-release-candidate
          path: |
            build/*-x64-Setup.exe
            build/*-x64-Setup.exe.blockmap
            build/latest.yml
            build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  Release:
    name: Publish GitHub Release
    if: ${{ inputs.publish_release }}
    needs: Windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out git repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download candidate assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: visoncube-music-windows-x64-release-candidate
          path: artifacts

      - name: Prepare release metadata
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if git ls-remote --exit-code --tags origin "refs/tags/v${PACKAGE_VERSION}" >/dev/null 2>&1; then
            echo "Release tag v${PACKAGE_VERSION} already exists." >&2
            exit 1
          fi
          echo "PACKAGE_VERSION=${PACKAGE_VERSION}" >> "$GITHUB_ENV"
          node <<'NODE'
          const fs = require('fs')
          const pkg = require('./package.json')
          const { parseVersionSections } = require('./publish/utils/updateChangeLog')
          const sections = parseVersionSections(fs.readFileSync('./publish/changeLog.md', 'utf8'))
          const current = sections.find(section => section.version === pkg.version)
          if (!current) throw new Error(`Missing release notes for ${pkg.version}.`)
          fs.writeFileSync('./release-notes.md', `${current.markdown}\n\n> Windows 安装包沿用旧版未签名发布方式，系统可能显示“未知发布者”。\n`)
          NODE

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: VisonCube Music Windows v${{ env.PACKAGE_VERSION }}
          tag_name: v${{ env.PACKAGE_VERSION }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            artifacts/VisonCube-Music-v${{ env.PACKAGE_VERSION }}-x64-Setup.exe
            artifacts/VisonCube-Music-v${{ env.PACKAGE_VERSION }}-x64-Setup.exe.blockmap
            artifacts/latest.yml
            artifacts/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
