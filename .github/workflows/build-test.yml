name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IS_CI: 'true'

jobs:
  test:
    name: Test and build Windows sources
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out git repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup build environment
        uses: ./.github/actions/setup

      - name: Test music sync model
        run: npm run test:music-sync

      - name: Lint source code
        # The upstream renderer's mixed TS/JS parser cannot provide the type
        # information required by this legacy rule. Other ESLint rules remain
        # strict; this rule is tracked separately for a future parser migration.
        run: |
          npm run lint -- --rule "@typescript-eslint/no-floating-promises: off"

      - name: Build all source bundles
        run: npm run build
