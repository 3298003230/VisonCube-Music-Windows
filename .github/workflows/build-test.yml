name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IS_CI: 'true'

jobs:
  test:
    name: Test and build Windows sources
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out git repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup build environment
        uses: ./.github/actions/setup

      - name: Test music sync model
        run: npm run test:music-sync

      - name: Lint source code
        # Lint only files changed by this commit so legacy code does not make
        # every build rescan the whole tree. Other ESLint rules remain strict.
        run: |
          $files = @(git diff --name-only HEAD^ HEAD | Where-Object { $_ -match '^src/.*\.(ts|js|vue)$' })
          if ($files.Count -eq 0) {
            Write-Host 'No source files changed in this commit; skipping targeted lint.'
            exit 0
          }
          npx eslint --ext .ts,.js,.vue -f node_modules/eslint-formatter-friendly --rule "@typescript-eslint/no-floating-promises: off" $files

      - name: Build all source bundles
        run: npm run build
