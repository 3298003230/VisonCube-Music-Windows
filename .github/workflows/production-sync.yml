name: Production Sync

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to sync, without leading v'
        required: true
        default: '2.13.5'
        type: string
      android_asset:
        description: 'Android APK used by the production update endpoint'
        required: true
        default: 'universal'
        type: choice
        options:
          - universal
          - arm64-v8a
      confirm_sync:
        description: 'I confirm this will update Music COS assets and the production release list'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: visoncube-music-production-sync
  cancel-in-progress: false

env:
  DOWNLOAD_BASE_URL: https://download.sjmf.xyz
  RELEASE_API_BASE_URL: https://linux.sjmf.xyz/api/releases
  WINDOWS_COS_PREFIX: VisonCube/Music/Windows
  ANDROID_COS_PREFIX: VisonCube/Music/Android
  DEFAULT_COS_BUCKET: visoncube-releases-1442257950
  DEFAULT_COS_REGION: ap-shanghai
  DEFAULT_SERVER_HOST: linux.sjmf.xyz
  DEFAULT_SERVER_PORT: '22'
  DEFAULT_SERVER_USER: ubuntu
  DEFAULT_SERVER_RELEASES_PATH: /home/ubuntu/ServerCode/VisonCube/update/releases.json

jobs:
  Prepare:
    name: Download and verify release assets
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Validate inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ inputs.version }}'
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must be like 2.13.5, without leading v. Got: $version"
          }
          if ('${{ inputs.confirm_sync }}' -ne 'true') {
            throw 'Production sync was not confirmed. Re-run with confirm_sync checked after candidate and device validation.'
          }

      - name: Download GitHub Release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ inputs.version }}'
          $androidAsset = '${{ inputs.android_asset }}'
          New-Item -ItemType Directory -Force -Path payload/windows, payload/android | Out-Null

          $downloads = @(
            @{
              Url = "https://github.com/3298003230/VisonCube-Music-Windows/releases/download/v$version/VisonCube-Music-v$version-x64-Setup.exe"
              Target = "payload/windows/VisonCube-Music-v$version-x64-Setup.exe"
            },
            @{
              Url = "https://github.com/3298003230/VisonCube-Music-Windows/releases/download/v$version/VisonCube-Music-v$version-x64-Setup.exe.blockmap"
              Target = "payload/windows/VisonCube-Music-v$version-x64-Setup.exe.blockmap"
            },
            @{
              Url = "https://github.com/3298003230/VisonCube-Music-Windows/releases/download/v$version/latest.yml"
              Target = 'payload/windows/latest.yml'
            },
            @{
              Url = "https://github.com/3298003230/VisonCube-Music-Windows/releases/download/v$version/SHA256SUMS.txt"
              Target = 'payload/windows/SHA256SUMS.txt'
            },
            @{
              Url = "https://github.com/3298003230/VisonCube-Music-Android/releases/download/v$version/visoncube-music-mobile-v$version-$androidAsset.apk"
              Target = "payload/android/visoncube-music-mobile-v$version-$androidAsset.apk"
            },
            @{
              Url = "https://github.com/3298003230/VisonCube-Music-Android/releases/download/v$version/SHA256SUMS.txt"
              Target = 'payload/android/SHA256SUMS.txt'
            }
          )

          foreach ($item in $downloads) {
            Write-Output "Downloading $($item.Url)"
            curl.exe --fail --location --retry 5 --retry-delay 2 --output $item.Target $item.Url
          }

      - name: Verify downloaded assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ inputs.version }}'
          $androidAsset = '${{ inputs.android_asset }}'
          $installerName = "VisonCube-Music-v$version-x64-Setup.exe"
          $blockmapName = "$installerName.blockmap"
          $androidName = "visoncube-music-mobile-v$version-$androidAsset.apk"
          $installer = Get-Item -LiteralPath "payload/windows/$installerName"
          $blockmap = Get-Item -LiteralPath "payload/windows/$blockmapName"
          $latest = Get-Item -LiteralPath 'payload/windows/latest.yml'
          $androidApk = Get-Item -LiteralPath "payload/android/$androidName"
          $windowsSums = Get-Item -LiteralPath 'payload/windows/SHA256SUMS.txt'
          $androidSums = Get-Item -LiteralPath 'payload/android/SHA256SUMS.txt'

          foreach ($asset in @($installer, $blockmap, $latest, $androidApk, $windowsSums, $androidSums)) {
            if ($asset.Length -le 0) {
              throw "Downloaded asset is empty: $($asset.FullName)"
            }
          }

          $latestContent = Get-Content -Raw -LiteralPath $latest.FullName
          if ($latestContent -notmatch "(?m)^version:\s+$([regex]::Escape($version))\s*$") {
            throw "latest.yml version does not match $version"
          }
          if ($latestContent -notmatch [regex]::Escape("path: $installerName")) {
            throw "latest.yml does not reference $installerName"
          }

          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($signature.Status -ne 'NotSigned') {
            throw "Expected the approved unsigned Windows package, got: $($signature.Status)"
          }

          $publishedAt = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          $windowsSha = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash.ToUpperInvariant()
          $blockmapSha = (Get-FileHash -Algorithm SHA256 -LiteralPath $blockmap.FullName).Hash.ToUpperInvariant()
          $latestSha = (Get-FileHash -Algorithm SHA256 -LiteralPath $latest.FullName).Hash.ToUpperInvariant()
          $androidSha = (Get-FileHash -Algorithm SHA256 -LiteralPath $androidApk.FullName).Hash.ToUpperInvariant()
          $windowsSumsSha = (Get-FileHash -Algorithm SHA256 -LiteralPath $windowsSums.FullName).Hash.ToUpperInvariant()
          $androidSumsSha = (Get-FileHash -Algorithm SHA256 -LiteralPath $androidSums.FullName).Hash.ToUpperInvariant()

          $changelog = "VisonCube Music $version 更新内容：`n- Windows 关闭行为支持托盘隐藏或彻底退出选择。`n- 同步原作者近期稳定修复，改善歌词解析等兼容性。`n- 优化 Windows 托盘图标和 Android 应用图标显示。"
          $manifest = [ordered]@{
            version = $version
            android_asset = $androidAsset
            published_at = $publishedAt
            changelog = $changelog
            windows = [ordered]@{
              client_id = 'music-windows'
              file_name = $installerName
              blockmap_name = $blockmapName
              latest_name = 'latest.yml'
              checksums_name = 'SHA256SUMS.txt'
              download_url = "${{ env.DOWNLOAD_BASE_URL }}/${{ env.WINDOWS_COS_PREFIX }}/$installerName"
              feed_url = "${{ env.DOWNLOAD_BASE_URL }}/${{ env.WINDOWS_COS_PREFIX }}"
              asset_path = "${{ env.WINDOWS_COS_PREFIX }}/$installerName"
              feed_path = "${{ env.WINDOWS_COS_PREFIX }}"
              size = $installer.Length
              sha256 = $windowsSha
              blockmap_size = $blockmap.Length
              blockmap_sha256 = $blockmapSha
              latest_size = $latest.Length
              latest_sha256 = $latestSha
              checksums_size = $windowsSums.Length
              checksums_sha256 = $windowsSumsSha
              authenticode = 'NotSigned'
            }
            android = [ordered]@{
              client_id = 'music-android'
              file_name = $androidName
              checksums_name = 'SHA256SUMS.txt'
              download_url = "${{ env.DOWNLOAD_BASE_URL }}/${{ env.ANDROID_COS_PREFIX }}/$androidName"
              feed_url = ''
              asset_path = "${{ env.ANDROID_COS_PREFIX }}/$androidName"
              feed_path = ''
              size = $androidApk.Length
              sha256 = $androidSha
              checksums_size = $androidSums.Length
              checksums_sha256 = $androidSumsSha
            }
          }
          $manifest | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath 'payload/production-manifest.json' -Encoding utf8NoBOM

          Get-ChildItem -LiteralPath payload -Recurse -File |
            Select-Object FullName, Length, @{Name = 'SHA256'; Expression = { (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash }} |
            Format-Table -AutoSize
          Write-Output 'Authenticode status: NotSigned'

      - name: Upload production sync payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visoncube-music-production-sync-payload
          path: payload
          if-no-files-found: error
          retention-days: 30

  Sync:
    name: Upload COS assets and update release list
    needs: Prepare
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      VISONCUBE_COS_SECRET_ID: ${{ secrets.VISONCUBE_COS_SECRET_ID }}
      VISONCUBE_COS_SECRET_KEY: ${{ secrets.VISONCUBE_COS_SECRET_KEY }}
      VISONCUBE_COS_BUCKET: ${{ secrets.VISONCUBE_COS_BUCKET }}
      VISONCUBE_COS_REGION: ${{ secrets.VISONCUBE_COS_REGION }}
      VISONCUBE_SERVER_HOST: ${{ secrets.VISONCUBE_SERVER_HOST }}
      VISONCUBE_SERVER_PORT: ${{ secrets.VISONCUBE_SERVER_PORT }}
      VISONCUBE_SERVER_USER: ${{ secrets.VISONCUBE_SERVER_USER }}
      VISONCUBE_SERVER_SSH_KEY: ${{ secrets.VISONCUBE_SERVER_SSH_KEY }}
      VISONCUBE_SERVER_KNOWN_HOSTS: ${{ secrets.VISONCUBE_SERVER_KNOWN_HOSTS }}
      VISONCUBE_SERVER_RELEASES_PATH: ${{ secrets.VISONCUBE_SERVER_RELEASES_PATH }}
    steps:
      - name: Validate production secrets
        shell: bash
        run: |
          set -euo pipefail
          required=(
            VISONCUBE_COS_SECRET_ID
            VISONCUBE_COS_SECRET_KEY
            VISONCUBE_SERVER_SSH_KEY
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} )); then
            printf 'Missing required secret(s): %s\n' "${missing[*]}" >&2
            exit 1
          fi
          echo 'Required production secrets are present.'
          echo "COS bucket defaults to ${DEFAULT_COS_BUCKET}; override with VISONCUBE_COS_BUCKET if needed."
          echo "COS region defaults to ${DEFAULT_COS_REGION}; override with VISONCUBE_COS_REGION if needed."
          echo "Server defaults to ${DEFAULT_SERVER_USER}@${DEFAULT_SERVER_HOST}:${DEFAULT_SERVER_PORT}; override with VISONCUBE_SERVER_* secrets if needed."

      - name: Download production sync payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: visoncube-music-production-sync-payload
          path: payload

      - name: Backup current public release state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backup
          curl --fail --silent --show-error --location "${RELEASE_API_BASE_URL}/music-windows" --output backup/music-windows-before.json
          curl --fail --silent --show-error --location "${RELEASE_API_BASE_URL}/music-android" --output backup/music-android-before.json
          curl --fail --silent --show-error --location "${DOWNLOAD_BASE_URL}/${WINDOWS_COS_PREFIX}/latest.yml" --output backup/windows-latest-before.yml
          cp payload/production-manifest.json backup/production-manifest.json

      - name: Upload public-state backup artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visoncube-music-production-sync-backup
          path: backup
          if-no-files-found: error
          retention-days: 90

      - name: Upload assets to Music COS
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check coscmd
          export PATH="$HOME/.local/bin:$PATH"
          cos_bucket="${VISONCUBE_COS_BUCKET:-$DEFAULT_COS_BUCKET}"
          cos_region="${VISONCUBE_COS_REGION:-$DEFAULT_COS_REGION}"
          cleanup() {
            rm -f "$HOME/.cos.conf"
          }
          trap cleanup EXIT

          coscmd config \
            -a "$VISONCUBE_COS_SECRET_ID" \
            -s "$VISONCUBE_COS_SECRET_KEY" \
            -b "$cos_bucket" \
            -r "$cos_region"

          manifest='payload/production-manifest.json'
          windows_file=$(python3 -c "import json; print(json.load(open('$manifest', encoding='utf-8'))['windows']['file_name'])")
          windows_blockmap=$(python3 -c "import json; print(json.load(open('$manifest', encoding='utf-8'))['windows']['blockmap_name'])")
          android_file=$(python3 -c "import json; print(json.load(open('$manifest', encoding='utf-8'))['android']['file_name'])")

          coscmd upload "payload/windows/${windows_file}" "${WINDOWS_COS_PREFIX}/${windows_file}"
          coscmd upload "payload/windows/${windows_blockmap}" "${WINDOWS_COS_PREFIX}/${windows_blockmap}"
          coscmd upload "payload/windows/latest.yml" "${WINDOWS_COS_PREFIX}/latest.yml"
          coscmd upload "payload/windows/SHA256SUMS.txt" "${WINDOWS_COS_PREFIX}/SHA256SUMS.txt"
          coscmd upload "payload/android/${android_file}" "${ANDROID_COS_PREFIX}/${android_file}"
          coscmd upload "payload/android/SHA256SUMS.txt" "${ANDROID_COS_PREFIX}/SHA256SUMS.txt"

      - name: Verify public COS files
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import tempfile
          import time

          manifest = json.loads(pathlib.Path('payload/production-manifest.json').read_text(encoding='utf-8'))
          checks = [
              (manifest['windows']['download_url'], manifest['windows']['size'], manifest['windows']['sha256']),
              (f"{os.environ['DOWNLOAD_BASE_URL']}/{os.environ['WINDOWS_COS_PREFIX']}/{manifest['windows']['blockmap_name']}", manifest['windows']['blockmap_size'], manifest['windows']['blockmap_sha256']),
              (f"{os.environ['DOWNLOAD_BASE_URL']}/{os.environ['WINDOWS_COS_PREFIX']}/latest.yml", manifest['windows']['latest_size'], manifest['windows']['latest_sha256']),
              (f"{os.environ['DOWNLOAD_BASE_URL']}/{os.environ['WINDOWS_COS_PREFIX']}/SHA256SUMS.txt", manifest['windows']['checksums_size'], manifest['windows']['checksums_sha256']),
              (manifest['android']['download_url'], manifest['android']['size'], manifest['android']['sha256']),
              (f"{os.environ['DOWNLOAD_BASE_URL']}/{os.environ['ANDROID_COS_PREFIX']}/SHA256SUMS.txt", manifest['android']['checksums_size'], manifest['android']['checksums_sha256']),
          ]

          for url, expected_size, expected_sha in checks:
              for attempt in range(1, 13):
                  with tempfile.NamedTemporaryFile(delete=False) as tmp:
                      tmp_path = pathlib.Path(tmp.name)
                  try:
                      subprocess.run(['curl', '--fail', '--silent', '--show-error', '--location', url, '--output', str(tmp_path)], check=True)
                      actual_size = tmp_path.stat().st_size
                      actual_sha = subprocess.check_output(['sha256sum', str(tmp_path)], text=True).split()[0].upper()
                      if actual_size != int(expected_size):
                          raise AssertionError(f'Unexpected size for {url}: {actual_size} != {expected_size}')
                      if actual_sha != expected_sha.upper():
                          raise AssertionError(f'Unexpected sha256 for {url}: {actual_sha} != {expected_sha}')
                      print(f'OK {url} {actual_size} {actual_sha}')
                      break
                  except Exception as error:
                      if attempt == 12:
                          raise SystemExit(str(error))
                      print(f'COS verification attempt {attempt} failed for {url}: {error}; retrying...')
                      time.sleep(10)
                  finally:
                      tmp_path.unlink(missing_ok=True)

          range_status = subprocess.check_output([
              'curl', '--silent', '--show-error', '--location',
              '--output', '/dev/null', '--write-out', '%{http_code}',
              '--header', 'Range: bytes=0-0',
              manifest['windows']['download_url'],
          ], text=True)
          if range_status != '206':
              raise SystemExit(f'Windows installer Range request expected 206, got {range_status}')
          print('OK Windows installer Range 206')
          PY

      - name: Update production release list on server
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          server_host="${VISONCUBE_SERVER_HOST:-$DEFAULT_SERVER_HOST}"
          server_port="${VISONCUBE_SERVER_PORT:-$DEFAULT_SERVER_PORT}"
          server_user="${VISONCUBE_SERVER_USER:-$DEFAULT_SERVER_USER}"
          releases_path="${VISONCUBE_SERVER_RELEASES_PATH:-$DEFAULT_SERVER_RELEASES_PATH}"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          cleanup() {
            rm -f "$HOME/.ssh/visoncube_music_server_key"
          }
          trap cleanup EXIT
          python3 <<'PY'
          import os
          import pathlib
          key = os.environ['VISONCUBE_SERVER_SSH_KEY']
          if '\\n' in key and '\n' not in key:
              key = key.replace('\\n', '\n')
          pathlib.Path.home().joinpath('.ssh', 'visoncube_music_server_key').write_text(key.rstrip() + '\n', encoding='utf-8')
          PY
          chmod 600 "$HOME/.ssh/visoncube_music_server_key"

          if [[ -n "${VISONCUBE_SERVER_KNOWN_HOSTS:-}" ]]; then
            printf '%s\n' "$VISONCUBE_SERVER_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -p "$server_port" -H "$server_host" >> "$HOME/.ssh/known_hosts"
          fi

          ssh_opts=(-i "$HOME/.ssh/visoncube_music_server_key" -p "$server_port" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          scp_opts=(-i "$HOME/.ssh/visoncube_music_server_key" -P "$server_port" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          target="${server_user}@${server_host}"
          remote_tmp="/tmp/visoncube-music-releases-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"

          ssh "${ssh_opts[@]}" "$target" "VISONCUBE_RELEASES_PATH=$(printf '%q' "$releases_path") VISONCUBE_BACKUP_STAMP=$(printf '%q' "$stamp") VISONCUBE_RELEASE_VERSION=$(printf '%q' "$version") bash -s" <<'REMOTE_BACKUP'
          set -euo pipefail
          releases_dir="$(dirname "$VISONCUBE_RELEASES_PATH")"
          backup_dir="${releases_dir}/backups/music-${VISONCUBE_RELEASE_VERSION}-${VISONCUBE_BACKUP_STAMP}"
          test -f "$VISONCUBE_RELEASES_PATH"
          mkdir -p "$backup_dir"
          cp -p "$VISONCUBE_RELEASES_PATH" "$backup_dir/releases.json"
          printf '%s\n' "$backup_dir"
          REMOTE_BACKUP

          ssh "${ssh_opts[@]}" "$target" "cat $(printf '%q' "$releases_path")" > server-releases.current.json

          python3 <<'PY'
          import json
          import pathlib

          releases_path = pathlib.Path('server-releases.current.json')
          manifest = json.loads(pathlib.Path('payload/production-manifest.json').read_text(encoding='utf-8'))
          data = json.loads(releases_path.read_text(encoding='utf-8'))

          def walk_entries(node):
              if isinstance(node, dict):
                  if isinstance(node.get('client_id'), str):
                      yield node
                  for value in node.values():
                      yield from walk_entries(value)
              elif isinstance(node, list):
                  for item in node:
                      yield from walk_entries(item)

          entries = {entry.get('client_id'): entry for entry in walk_entries(data)}
          for client_id in ('music-windows', 'music-android'):
              if client_id not in entries:
                  raise SystemExit(f'Missing release entry: {client_id}')

          version = manifest['version']
          published_at = manifest['published_at']
          changelog = manifest['changelog']

          entries['music-windows'].update({
              'version': version,
              'display_version': version,
              'asset_path': manifest['windows']['asset_path'],
              'feed_path': manifest['windows']['feed_path'],
              'download_base': '',
              'file_name': manifest['windows']['file_name'],
              'download_url': manifest['windows']['download_url'],
              'feed_url': manifest['windows']['feed_url'],
              'sha256': manifest['windows']['sha256'],
              'changelog': changelog,
              'published_at': published_at,
          })
          entries['music-android'].update({
              'version': version,
              'display_version': version,
              'asset_path': manifest['android']['asset_path'],
              'feed_path': manifest['android']['feed_path'],
              'download_base': '',
              'file_name': manifest['android']['file_name'],
              'download_url': manifest['android']['download_url'],
              'feed_url': manifest['android']['feed_url'],
              'sha256': manifest['android']['sha256'],
              'changelog': changelog,
              'published_at': published_at,
          })

          pathlib.Path('server-releases.updated.json').write_text(
              json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n',
              encoding='utf-8',
          )
          PY

          scp "${scp_opts[@]}" server-releases.updated.json "${target}:${remote_tmp}"
          ssh "${ssh_opts[@]}" "$target" "VISONCUBE_RELEASES_PATH=$(printf '%q' "$releases_path") VISONCUBE_REMOTE_TMP=$(printf '%q' "$remote_tmp") bash -s" <<'REMOTE_INSTALL'
          set -euo pipefail
          releases_dir="$(dirname "$VISONCUBE_RELEASES_PATH")"
          same_dir_tmp="${releases_dir}/.releases.json.${RANDOM}.$$"
          python3 -m json.tool "$VISONCUBE_REMOTE_TMP" >/dev/null
          install -m 0644 "$VISONCUBE_REMOTE_TMP" "$same_dir_tmp"
          mv "$same_dir_tmp" "$VISONCUBE_RELEASES_PATH"
          rm -f "$VISONCUBE_REMOTE_TMP"
          REMOTE_INSTALL

      - name: Verify production release APIs
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import pathlib
          import subprocess
          import time

          manifest = json.loads(pathlib.Path('payload/production-manifest.json').read_text(encoding='utf-8'))
          api_base = '${{ env.RELEASE_API_BASE_URL }}'
          expected = {
              'music-windows': {
                  'version': manifest['version'],
                  'file_name': manifest['windows']['file_name'],
                  'download_url': manifest['windows']['download_url'],
                  'sha256': manifest['windows']['sha256'],
              },
              'music-android': {
                  'version': manifest['version'],
                  'file_name': manifest['android']['file_name'],
                  'download_url': manifest['android']['download_url'],
                  'sha256': manifest['android']['sha256'],
              },
          }

          def read_json(url):
              raw = subprocess.check_output(['curl', '--fail', '--silent', '--show-error', '--location', url], text=True)
              return json.loads(raw)

          for attempt in range(1, 11):
              try:
                  for client_id, fields in expected.items():
                      data = read_json(f'{api_base}/{client_id}')
                      for key, value in fields.items():
                          if data.get(key) != value:
                              raise AssertionError(f'{client_id}.{key}: {data.get(key)!r} != {value!r}')
                      print(f'OK {client_id} {data.get("version")} {data.get("file_name")}')
                  break
              except Exception as error:
                  if attempt == 10:
                      raise
                  print(f'API verification attempt {attempt} failed: {error}; retrying...')
                  time.sleep(3)
          PY
