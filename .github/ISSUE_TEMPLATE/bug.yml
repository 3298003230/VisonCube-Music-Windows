name: 🐞 报告错误
description: 报告 VisonCube Music Windows 的错误，请先查看常见问题及搜索 Issue 列表。
title: "[Bug]: "
body:
- type: checkboxes
  id: check-answer
  attributes:
    label: 解决方案检查
    description: 请确保你已完成以下所有操作。
    options:
      - label: 我已阅读 [常见问题](https://github.com/3298003230/VisonCube-Music-Windows/blob/main/FAQ.md)，并没有找到解决方案。
        required: true
      - label: 我已搜索 [Issue 列表](https://github.com/3298003230/VisonCube-Music-Windows/issues?q=is%3Aissue+)，并没有发现类似的问题。
        required: true
- type: textarea
  id: expected-behavior
  attributes:
    label: 预期行为
    description: 对期望发生的事情的清晰简明描述。
  validations:
    required: true
- type: textarea
  id: actual-behavior
  attributes:
    label: 实际行为
    description: 对实际发生的事情的清晰简明描述。
  validations:
    required: true
- type: input
  id: version
  attributes:
    label: VisonCube Music 版本
    description: 你使用什么版本的 VisonCube Music？
    placeholder: 例如 2.13.5
  validations:
    required: true
- type: input
  id: last-known-working-version
  attributes:
    label: 最后正常的版本
    description: 如果有，请在此处填写最后正常的版本。
    placeholder: 例如 2.13.4
- type: input
  id: operating-system-version
  attributes:
    label: 操作系统版本
    description: 请填写 Windows、macOS 或 Linux 的系统版本。
    placeholder: 例如 Windows 11 版本 24H2
  validations:
    required: true
- type: textarea
  id: additional-information
  attributes:
    label: 附加信息
    description: 请添加必要的复现步骤、日志、截图或视频；请勿提交密码、令牌和其他敏感信息。
