name: ✨ 功能请求
description: 为 VisonCube Music Windows 提出一个想法，请先查看常见问题及搜索 Issue 列表。
title: "[Feature]: "
body:
- type: checkboxes
  id: check-answer
  attributes:
    label: 解决方案检查
    description: 请确保你已完成以下所有操作。
    options:
      - label: 我已阅读 [常见问题](https://github.com/3298003230/VisonCube-Music-Windows/blob/main/FAQ.md)，但没有找到解决方案。
        required: true
      - label: 我已搜索 [Issue 列表](https://github.com/3298003230/VisonCube-Music-Windows/issues?q=is%3Aissue+)，但没有发现类似的问题。
        required: true
- type: textarea
  id: problem-description
  attributes:
    label: 问题描述
    description: 请添加清晰简洁的描述，说明你希望通过此功能请求解决的问题。
  validations:
    required: true
- type: textarea
  id: proposed-solution
  attributes:
    label: 描述你想要的解决方案
    description: 简洁明了地描述你希望发生的事情。
  validations:
    required: true
- type: textarea
  id: alternatives-considered
  attributes:
    label: 描述你考虑过的替代方案
    description: 请说明你已考虑过的替代方案。
  validations:
    required: false
- type: textarea
  id: additional-information
  attributes:
    label: 附加信息
    description: 请添加必要的截图或其他补充信息；请勿提交密码、令牌和其他敏感信息。
